name: Uji dan terbit ke GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Token workflow ini diberi kebenaran 'pages: write', jadi langkah
# configure-pages boleh menghidupkan GitHub Pages secara automatik
# walaupun tetapan repo belum disentuh.
permissions:
  contents: read
  pages: write
  id-token: write

# Elak dua penerbitan berjalan serentak
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  uji:
    name: Ujian logik permainan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Jalankan ujian
        run: node test.js

  terbit:
    name: Terbit ke Pages
    needs: uji
    # Hanya terbit daripada main, bukan daripada pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sediakan Pages (hidupkan jika belum aktif)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Bungkus laman
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
